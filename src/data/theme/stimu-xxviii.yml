# ==========================================
# AS-Web Theme Configuration Example
# ==========================================
# Themes can override colors, the hero carousel configuration,
# and navbar logo animations.
# Unspecified properties will inherit from default site settings (src/consts.ts).

# Active time window (optional)
# Supports 'YYYY-MM-DD' or ISO 8601 strings (e.g. '2026-10-01T00:00:00').
# If startDate and endDate are omitted, the theme is inactive unless explicitly
# requested by a page layout via the theme prop.
# If multiple themes are active simultaneously, a conflict is detected and the
# default theme is used instead.
startDate: '2026-10-01'
endDate: '2026-11-21T23:59:59'

# Named color variables to override (optional)
# Available theme variables:
#   - as-violet-1 (navbar & title backgrounds, official AS violet)
#   - as-violet-2 (lighter, muted violet, official secondary AS violet)
#   - natural-white
#   - natural-black
#   - accent-violet-1 (lighter version of as-violet-1)
#   - background-violet (tints, overlays)
#   - arduino-blue

colors:
  as-violet-1: '#0d122b'
  as-violet-2: '#acb0db'
  accent-violet-1: '#1c2854'
  background-violet: '#141c3d'

# Image carousel configuration (optional)
# Name of the carousel config file in `src/data/carousel/<name>.yaml`
# Defaults to 'default'. Set to false to disable hero carousel.
carousel: stimu-xxviii

# Logo animation shown in the navbar (optional)
# Can be a single path or a raw SVG string.
logo: '@assets/logos/as-stimu-xxviii.svg'
